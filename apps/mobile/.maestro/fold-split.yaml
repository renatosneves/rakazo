appId: com.rakazo.app
name: Rakazo unfolded split view
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- extendedWaitUntil:
    visible: "Sign up for Rakazo|Pixel Launcher isn't responding"
    timeout: 60000
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Close app"
- extendedWaitUntil:
    visible: "Sign up for Rakazo"
    timeout: 30000
- tapOn: "Sign in"
- tapOn: "Email"
- inputText: ${RAKAZO_SCREENSHOT_EMAIL}
- tapOn: "Password"
- inputText: ${RAKAZO_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- tapOn:
    text: "Don’t allow"
    optional: true
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 30000
- takeScreenshot: "fold-01-split-home"

- tapOn:
    text: "Researcher"
    index: 0
- extendedWaitUntil:
    visible: "Hide chats"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: "fold-02-researcher"

# Switching chats beside the list should swap in place, with no screen sliding in.
- tapOn:
    text: "Writer"
    index: 0
- takeScreenshot: "fold-03a-switch-instant"
- waitForAnimationToEnd
- takeScreenshot: "fold-03b-writer"

- tapOn: "Hide chats"
- waitForAnimationToEnd
- assertVisible: "Show chats"
- takeScreenshot: "fold-04-full-screen"
- tapOn: "Show chats"
- waitForAnimationToEnd
- takeScreenshot: "fold-05-list-back"

# Drag the divider to the right; the list widens and keeps its tags once wide enough.
- swipe:
    start: "40%, 50%"
    end: "60%, 50%"
    duration: 1500
- waitForAnimationToEnd
- takeScreenshot: "fold-06-list-widened"
- swipe:
    start: "52%, 50%"
    end: "33%, 50%"
    duration: 1500
- waitForAnimationToEnd
- takeScreenshot: "fold-07-list-narrowed"
